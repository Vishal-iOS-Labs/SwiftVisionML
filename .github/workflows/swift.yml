name: Swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftVisionML
        run: swift build -v
      - name: Run Unit Tests
        run: swift test -v
